<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Maintenance System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            flex: 1;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ccc;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #3498db;
            color: white;
        }

        .low-stock {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Stock Maintenance System</h1>
    <p>Inventory Management Dashboard</p>
</header>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>Total Products</h3>
            <h2>150</h2>
        </div>

        <div class="card">
            <h3>Available Stock</h3>
            <h2>1,250</h2>
        </div>

        <div class="card">
            <h3>Low Stock Items</h3>
            <h2>8</h2>
        </div>
    </div>

    <h2>Stock Details</h2>

    <table>
        <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Laptop</td>
            <td>Electronics</td>
            <td>25</td>
            <td>Available</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Keyboard</td>
            <td>Accessories</td>
            <td>5</td>
            <td class="low-stock">Low Stock</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Mouse</td>
            <td>Accessories</td>
            <td>30</td>
            <td>Available</td>
        </tr>
    </table>

</div>

</body>
</html>
